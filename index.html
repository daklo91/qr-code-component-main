<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | QR code component</title>

    <style>
      :root {
        --white: #ffffff;
        --slate-300: #d6e2f0;
        --slate-500: #68778d;
        --slate-900: #1f3251;
      }

      body {
        background-color: var(--slate-300);
      }

      .qr-card {
        font-family: "Outfit", sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
        background-color: var(--white);
        border-radius: 20px;
        padding: 16px;
        max-width: 288px;
        width: 100%;
        text-align: center;
        box-shadow: 1px 10px 9px -1px rgba(0, 0, 0, 0.05);
        -webkit-box-shadow: 1px 10px 9px -1px rgba(0, 0, 0, 0.05);
        -moz-box-shadow: 1px 10px 9px -1px rgba(0, 0, 0, 0.05);
      }

      .qr-card img {
        display: block;
        width: 100%;
        border-radius: 14px;
      }

      .qr-card h1 {
        color: var(--slate-900);
        font-weight: 700;
        font-size: 24px;
        margin: 22px 0px 23px 0px;
        letter-spacing: -1px;
        line-height: 26px;
      }

      .qr-card p {
        font-size: 15px;
        font-weight: 400;
        color: var(--slate-500);
        margin: 0 16px 24px 16px;
        letter-spacing: 0px;
        line-height: 20px;
      }

      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      main {
        position: absolute;
        left: 50%;
        top: 50%;
        -webkit-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <main>
      <article class="qr-card">
        <img
          src="images/image-qr-code.png"
          alt="QR code linking to Frontend Mentor website"
        />

        <h1>Improve your front-end skills by building projects</h1>
        <p>
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </article>
    </main>
  </body>
</html>
